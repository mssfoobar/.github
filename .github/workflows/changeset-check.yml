name: Changeset Check

# Reusable required-status check that enforces every PR carries a
# changeset (or marker-less changeset for no-bump changes). Skips:
#   * the changesets/action's own version PR (head ref starts with
#     `changeset-release/`) — that PR by design contains zero pending
#     changesets because it has just consumed them.
#   * dependabot PRs — mechanical dep bumps don't merit changesets in
#     the lazy + snapshot model; they roll into the next regular release.
#   * release sync-back PRs whose head ref matches the opt-in
#     `release-head-ref` input (e.g. `main`) — a main->develop release
#     sync only deletes the consumed changesets and carries none.
#   * PRs that touch none of the opt-in `publishable-paths` — a changeset
#     exists to move a published package's version, so a PR that cannot
#     affect any published artifact has nothing to declare. Without this,
#     every docs/ADR/CI-only PR must add an empty changeset purely to
#     satisfy the check; ops-hub accumulated 405 of them, 293 merely
#     restating their own commit message, and that haystack hid a real
#     release defect for six weeks (AOH-9125, AOH-9137).
#
# Pair with npm-pr-validation in a calling workflow that triggers on
# `pull_request: branches: [<integration-branch>]`. Both should be
# marked as required status checks on the integration branch's ruleset.

on:
  workflow_call:
    inputs:
      release-head-ref:
        required: false
        type: string
        default: ''
        description: 'Head branch of release sync-back PRs (e.g. "main"). A PR whose head ref matches is exempt from the changeset requirement — a release sync-back only deletes the consumed changesets and carries none. Empty (default) disables the exemption, so other consumers are unaffected.'
      publishable-paths:
        required: false
        type: string
        default: ''
        description: 'Newline-separated extended-regex patterns matching paths whose contents can reach a published artifact (e.g. "^packages/ui/" or "^modules/[^/]+/(web|client|types)/"). When set, a PR touching NONE of them is exempt from the changeset requirement. Empty (default) keeps the requirement unconditional, so other consumers are unaffected.'
      runner:
        required: false
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label to execute on. Defaults to GitHub-hosted ubuntu-latest; set to a self-hosted scale-set label (e.g. "arc-runner") to run the check on self-hosted runners.'

jobs:
  check:
    name: Check
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && github.actor != 'dependabot[bot]' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changeset present
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          RELEASE_HEAD_REF: ${{ inputs.release-head-ref }}
          PUBLISHABLE_PATHS: ${{ inputs.publishable-paths }}
        run: |
          # Release sync-back PRs (e.g. main -> develop) only delete the
          # consumed changesets and carry none, so they are exempt when the
          # caller opts in via the release-head-ref input. Exit 0 (success)
          # rather than skipping the job, so the required check is satisfied.
          if [ -n "$RELEASE_HEAD_REF" ] && [ "$HEAD_REF" = "$RELEASE_HEAD_REF" ]; then
            echo "Release sync-back PR (head '$HEAD_REF') — exempt from the changeset requirement."
            exit 0
          fi
          # A changeset's only job is to move a published package's version, so
          # a PR that cannot affect any published artifact has nothing to
          # declare. Opt-in: with the input unset this block does nothing.
          #
          # Deletions and renames count — removing a published source file
          # changes the artifact just as much as editing it — so no
          # --diff-filter here. `.changeset/` itself is excluded, or a PR that
          # only adds a changeset would look like it touched something.
          #
          # Exit 0 rather than skipping the job, for the same reason as the
          # release exemption above: this is a required status check, and a
          # skipped job leaves the PR waiting on a check run that never arrives.
          if [ -n "$PUBLISHABLE_PATHS" ]; then
            pattern=$(printf '%s' "$PUBLISHABLE_PATHS" | grep -v '^[[:space:]]*$' | paste -sd '|' -)
            if [ -n "$pattern" ]; then
              changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -v '^\.changeset/' || true)
              if [ -z "$changed" ]; then
                echo "PR touches nothing outside .changeset/ — no publishable path affected; exempt."
                exit 0
              fi
              if ! printf '%s\n' "$changed" | grep -qE "$pattern"; then
                echo "No publishable path touched by this PR — exempt from the changeset requirement."
                echo "Paths changed:"
                printf '%s\n' "$changed" | sed 's/^/  /'
                exit 0
              fi
            fi
          fi
          if git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" | grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' >/dev/null; then
            echo "Changeset found."
          else
            echo "::error::No changeset in this PR. Run \`npx changeset\` to add one, or add a marker-less changeset (empty frontmatter) for docs/CI/comment-only changes."
            exit 1
          fi
