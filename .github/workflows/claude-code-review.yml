name: Claude Code Review

# Reusable agentic PR review. Posts ONE plain PR comment per run.
#
# Deliberately NOT a required status check, and deliberately never a formal
# GitHub review: it can neither approve nor request changes, so it can't
# satisfy or block a required-approval rule. Green CI stays the merge bar —
# this is advice, not a gate.
#
# Call it from a repo like:
#
#   name: PR review
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review]
#   jobs:
#     review:
#       uses: mssfoobar/.github/.github/workflows/claude-code-review.yml@<sha>
#       with:
#         runner: arc-runner        # omit for GitHub-hosted
#         allowed_bots: 'my-app[bot]'   # omit to skip bot-authored PRs
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Bot-authored PRs. By default every non-human actor is skipped. A repo where
# an app opens real PRs — a release sync-back, an agent committing changes —
# opts those actors in with `allowed_bots`. Without it the job does not merely
# decline: the underlying action fails the run, so the check sits permanently
# red on PRs nobody can make green. Dependabot is excluded either way.
#
# The caller MUST also declare `permissions: {contents: read, pull-requests:
# write, id-token: write}`. A called workflow can only narrow its caller's
# permissions, never widen them, so a narrower (or absent) caller block fails
# the run at startup before any step executes.
#
# Pass the two secrets explicitly rather than `secrets: inherit` — inherit
# hands a reusable workflow EVERY secret the calling repo holds.
#
# Trigger. The official examples use `[opened, synchronize]`; we suggest
# `[opened, reopened, ready_for_review]` instead, for cost rather than
# correctness — a review per push is a full agentic run each time, which is
# expensive on a self-hosted scale set. Do NOT rely on `use_sticky_comment` to
# make `synchronize` cheap in comments either: this workflow passes a `prompt`,
# which puts the action in agent mode, and agent mode creates no tracking
# comment ("No tracking comment in agent mode", src/modes/agent/index.ts at the
# pinned SHA). The review is posted by the model via `gh pr comment`, so every
# run is a NEW comment — how one iams PR collected five. A caller that wants
# reviews on push should gate them itself (review only if no review exists
# yet). Re-review on demand with an `@claude` mention, which claude.yml handles.
#
# A PR opened while it conflicts with its base fires NO `pull_request`
# workflows at all, so with the suggested trigger it is never reviewed. The
# same "review only if none exists" gate on `synchronize` closes that gap.
#
# Failed runs. A review that fails — most often at the turn cap on a large PR —
# posts nothing, since the comment is the agent's last act. `report-failure`
# below says so on the PR instead of leaving only a red check. Its comment
# starts with the marker `<!-- claude-code-review:failed -->`, which a caller
# can count to cap retries; treat the marker as a stable contract.
#
# Security posture. No attacker-controlled text (PR title/body/branch name,
# comment bodies) is interpolated into `run:` or into the action args — the
# only expressions used are the PR number, the repo name, caller-supplied
# inputs and secrets, and the one `run:` block reads its secrets via `env:`.
#
# The residual risk is prompt injection: the agent necessarily READS the diff
# and PR body, which an author controls, and it holds `Bash(gh pr comment:*)`.
# A crafted PR could therefore talk it into posting a misleading comment. That
# is bounded on purpose — `contents: read` means it cannot push code, and it
# posts a plain comment rather than a formal review, so it can never approve,
# request changes, or satisfy a required-approval rule. Treat its output as
# advice from an untrusted source, which is what it is.

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label. Defaults to GitHub-hosted ubuntu-latest; set to a self-hosted scale-set label (e.g. "arc-runner") where GitHub-hosted runners are unavailable.'
      model:
        required: false
        type: string
        default: 'claude-sonnet-5'
        description: 'Model to review with. Pinned rather than floating so behaviour does not shift under a minor action bump.'
      max_turns:
        required: false
        type: number
        default: 80
        description: 'Upper bound on the agentic loop, to cap a stuck session. The find-then-verify prompt needs more turns than a single-pass review. 80 because 40 was the most common reason reviews went missing: measured on a monorepo caller, successful runs used p50 21 / p90 36 / max 49 turns, and about one run in eight died at 40 with nothing posted.'
      timeout_minutes:
        required: false
        type: number
        default: 40
        description: 'Job timeout in minutes. Raised with max_turns: the longest successful run measured took ~15 minutes at under 50 turns. A job that times out concludes `cancelled`, not `failure`.'
      review_instructions:
        required: false
        type: string
        default: ''
        description: 'Extra repo-specific guidance appended to the standard prompt (e.g. "pay particular attention to the kustomize overlays under gitops/").'
      allow_oauth_fallback:
        required: false
        type: boolean
        default: true
        description: 'Whether to fall back to CLAUDE_CODE_OAUTH_TOKEN when ANTHROPIC_API_KEY is absent. Set false in repos where Anthropic blocks Claude subscription access (currently mssfoobar/.github itself) so they skip cleanly instead of failing red.'
      allowed_bots:
        required: false
        type: string
        default: ''
        description: 'Comma-separated bot actors whose PRs may be reviewed (e.g. "jensen-junior[bot]"), or "*" for all. The action refuses non-human actors by default and FAILS RED rather than skipping, so a repo whose PRs are opened by an app (release sync-back, agent-authored changes) sees a permanently-failing check until it opts those actors in here. Grant only the bots you actually trust to author a diff: the review reads the PR body and diff, so a bot on this list is a prompt-injection surface — bounded by `contents: read` and a plain comment, but real.'
      report_failure:
        required: false
        type: boolean
        default: true
        description: 'Post a PR comment (marker `<!-- claude-code-review:failed -->`) when the review fails or times out, instead of leaving only a red check. Set false if the caller reports failures itself.'
    # Declared explicitly so callers can pass exactly these two rather than
    # `secrets: inherit`, which hands a reusable workflow EVERY secret in the
    # repo — registry tokens, signing keys, cloud credentials — when it needs
    # one. Both optional: the auth step below treats an absent secret as a
    # valid (skip) state, and a caller passing a secret its repo doesn't define
    # simply yields an empty string.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  claude-review:
    name: Claude review
    # Skip drafts, dependabot, and — unless the caller opted in — every other bot.
    #
    # The bot half is not a security control; the action's own `allowed_bots`
    # enforces that, and we forward `inputs.allowed_bots` to it below. This
    # condition exists so the default is a clean SKIP rather than a red X.
    # `allowed_bots` defaults to empty, meaning the action refuses any non-human
    # actor — but it refuses by FAILING ("Workflow initiated by non-human actor
    # … Add bot to allowed_bots list"), after spinning up a runner and checking
    # out the repo. In a repo whose PRs are routinely opened by an app (a
    # release sync-back, an agent-authored change) that is a permanently-failing
    # check plus wasted self-hosted runner time on every one. Gating the job on
    # `allowed_bots` being set keeps the out-of-the-box behaviour identical in
    # intent — bots are not reviewed — while reporting it honestly.
    #
    # Dependabot stays excluded unconditionally, even when a caller sets
    # `allowed_bots: '*'`: its runs get a restricted token that cannot read org
    # secrets (so the auth step would skip anyway), and reviewing a SHA bump is
    # low value — the check that matters is whether the pin matches the claimed
    # tag, which is a script, not a language model.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      (inputs.allowed_bots != '' || !endsWith(github.actor, '[bot]'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Matches the official examples in anthropics/claude-code-action.
    # `pull-requests: write` already covers posting a PR comment — no
    # `issues: write` needed, despite `gh pr comment` hitting the issues
    # endpoint. `id-token: write` is for OIDC.
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Auth: prefer an API key, fall back to the Claude subscription OAuth
      # token, skip cleanly if neither is present.
      #
      # Both paths exist because Anthropic blocks subscription (OAuth) access
      # for some repos — mssfoobar/.github itself fails with "Your organization
      # has disabled Claude subscription access for Claude Code" — while OAuth
      # works fine in consumer repos (ops-hub, iams, aa-cli). Provisioning
      # ANTHROPIC_API_KEY at the org level makes every repo behave uniformly
      # and is the preferred end state.
      #
      # Skipping rather than failing keeps a missing secret from littering PRs
      # with red checks on a job that is advisory by design.
      - name: Resolve Claude auth
        id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ALLOW_OAUTH: ${{ inputs.allow_oauth_fallback }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "method=api_key" >> "$GITHUB_OUTPUT"
          elif [ -n "$OAUTH_TOKEN" ] && [ "$ALLOW_OAUTH" = "true" ]; then
            echo "method=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$OAUTH_TOKEN" ]; then
            echo "::warning::Claude Code Review skipped: only CLAUDE_CODE_OAUTH_TOKEN is available and this caller sets allow_oauth_fallback=false (Anthropic blocks Claude subscription access for it). Provision ANTHROPIC_API_KEY at the org level to enable reviews here."
            echo "method=skip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude Code Review skipped: neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN was visible. Provision one at the org level, and check the calling workflow passes them under its secrets: map."
            echo "method=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.auth.outputs.method != 'skip'
        # v6, per the official examples. v4 targets Node 20, which GitHub now
        # force-runs on Node 24 and warns about on every run.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # depth 1, matching the official examples. The action checks out the
          # PR branch, and the review reads the diff through `gh pr diff` (an
          # API call) plus the working tree — neither needs local history. A
          # full clone would be a real cost on a large monorepo, especially on
          # self-hosted runners.
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.auth.outputs.method != 'skip'
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ steps.auth.outputs.method == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # INERT here, kept in case upstream changes: sticky comments apply to
          # the action's tracking comment, and agent mode (a `prompt` is set)
          # creates none. The review is a fresh `gh pr comment` every run. See
          # "Trigger" in the header.
          use_sticky_comment: true
          # Empty (the default) means the action refuses every non-human actor.
          # The job-level `if` above already skips in that case, so this only
          # takes effect for a caller that deliberately opted bots in.
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Start by reading the repo's AGENTS.md and/or CLAUDE.md. Violations of
            the conventions documented there are valid findings; your own
            stylistic preferences are not.

            The PR branch is already checked out in the current working directory,
            as a shallow clone. Get the diff with `gh pr diff` and read the
            surrounding files in the working tree for context — never review from
            diff hunks alone. There is no local history, so use `gh` rather than
            `git log`/`git show` to look at anything outside the checkout.

            ## What to look for

            Correctness and safety, in roughly this priority order:

            1. Logic errors and unhandled edge cases that produce wrong output.
            2. Data loss or destructive operations — anything that deletes,
               overwrites or truncates state the user did not ask to destroy,
               especially on an error path.
            3. Silent failures: a non-zero exit or rejected promise that is
               swallowed, a catch block that continues as if nothing happened, a
               "success" report that does not reflect what actually happened.
            4. Security: injection via unquoted interpolation, secrets reaching
               disk / logs / argv, credentials crossing a boundary in the clear,
               permissions broader than the consumer needs.
            5. Concurrency and lifecycle bugs: races, leaks, cancellation that
               does not actually cancel.
            6. Test gaps that would let a realistic bug ship undetected. Name the
               specific untested input partition and the bug it would hide — never
               just "add more tests".

            ## Verify before you post

            This is the part that matters most. For each candidate finding, go
            back to the code and try to REFUTE it. Reviewers routinely hallucinate
            functions that do not exist, guards they did not read, conventions the
            repo does not have, and "missing" handling that is present one frame
            up the stack. Run commands to check rather than reasoning from memory.

            Drop anything you cannot positively confirm. A short, correct review is
            far more valuable than a long one: every wrong finding costs a human
            the time to disprove it, and teaches them to skim the next one.

            ## Output

            Post exactly ONE comment using `gh pr comment`. Structure it as:

            - A one-or-two sentence verdict up front.
            - Findings, most severe first, each with file:line, what breaks, and a
              concrete failure scenario (specific inputs or state → wrong result).
            - A short "not blocking, but worth knowing" section for lower-value
              observations, if you have any.

            If the PR is clean, say so in one or two lines. Do NOT pad with generic
            advice, do not restate what the PR does back at its author, and do not
            list the things you checked and found fine.

            ${{ inputs.review_instructions }}

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # `--allowedTools` camelCase per the official docs (the CLI accepts
          # `--allowed-tools` too, but match upstream so this greps cleanly
          # against their examples).
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --model ${{ inputs.model }}
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(ls:*),Read,Grep,Glob"

  # A failed review used to leave nothing on the PR but a red check nobody
  # reads. Say so on the PR.
  #
  # Counts a review job that FAILED, or was CANCELLED inside a live run — a job
  # past `timeout-minutes` concludes `cancelled`, never `failure` (proven on a
  # throwaway run: `needs.<id>.result == 'cancelled'`, with `!cancelled()` still
  # true downstream). `!cancelled()` excludes a run cancelled as a whole: a
  # caller's concurrency superseding it, a queued run being replaced, or a
  # manual cancel — none of which is a failed review. A skipped review (draft,
  # bot, dependabot) is never reported, and neither is a clean auth skip, which
  # ends green.
  #
  # Accepted cost: a job that waited 24h for a runner also ends `cancelled`, so
  # a runner outage is reported as a failed review.
  #
  # The body avoids the `@claude` trigger word as a precaution; a comment
  # posted with GITHUB_TOKEN starts no workflow run anyway.
  report-failure:
    name: Report failed review
    needs: claude-review
    if: >-
      inputs.report_failure && !cancelled() &&
      (needs.claude-review.result == 'failure' || needs.claude-review.result == 'cancelled')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "<!-- claude-code-review:failed -->
          The automated Claude review run [failed or timed out]($RUN_URL). If no review appears above, the run log says why — on a large PR it is usually the turn cap.

          Close and reopen the PR to try again."
