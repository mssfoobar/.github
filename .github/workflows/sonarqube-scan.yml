name: SonarQube Scan

on:
    workflow_call:
        inputs:
            runner:
                required: false
                type: string
                default: 'arc-runner'
                description: "Runner label. Defaults to the self-hosted arc-runner scale set. Pass ubuntu-latest only when calling from a public repository."
            project_base_dir:
                required: true
                type: string

permissions:
    contents: read

jobs:
    sonar-scan:
        name: "SonarQube static Analysis"
        runs-on: ${{ inputs.runner }}

        steps:
            - name: "Checkout code"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "SonarQube Scan"
              uses: SonarSource/sonarqube-scan-action@master
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
              with:
                  projectBaseDir: ${{ inputs.project_base_dir }}
                  args: >
                      -Dsonar.projectVersion=${{ github.ref_name }}

            - name: "SonarQube Quality Gate check"
              uses: sonarsource/sonarqube-quality-gate-action@master
              with:
                  pollingTimeoutSec: 600
                  scanMetadataReportFile: "./${{ inputs.project_base_dir }}/.scannerwork/report-task.txt"
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
