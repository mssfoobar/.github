name: Monorepo Changeset Release

# Eager-bump release for an npm-workspaces monorepo. On a push to the release
# branch, `changeset version` consumes the pending changesets; each package
# whose version changed then gets its own tag (`<name without scope>/v<version>`)
# and its own GitHub Release (`<name> v<version>`).

on:
    workflow_call:
        inputs:
            node-version:
                required: true
                type: string
                description: "The version of Node.js to use"
            scope:
                required: false
                type: string
                default: ""
                description: "npm scope for GitHub Packages auth (e.g. @mssfoobar). Leave empty if no private packages."
            sync-branch:
                required: false
                type: string
                default: develop
                description: "Branch to sync version bump back to via PR"

jobs:
    release:
        name: Version & Release
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write
            packages: read

        steps:
            - name: Generate App Token
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              id: app-token
              with:
                  app-id: ${{ vars.DEPLOYMENT_APP_ID }}
                  private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm
                  registry-url: ${{ inputs.scope && 'https://npm.pkg.github.com' || '' }}
                  scope: ${{ inputs.scope }}

            - name: Install dependencies
              run: npm ci --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check for pending changesets
              id: check_changesets
              run: |
                  CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' | head -1)
                  if [ -z "$CHANGESET_FILES" ]; then
                    echo "has_changesets=false" >> "$GITHUB_OUTPUT"
                    echo "No pending changesets found — skipping release."
                  else
                    echo "has_changesets=true" >> "$GITHUB_OUTPUT"
                    echo "Pending changesets found — proceeding with release."
                  fi

            - name: Snapshot versions before bump
              if: steps.check_changesets.outputs.has_changesets == 'true'
              id: pre_versions
              run: |
                  # Record current versions of all workspace packages
                  node -e "
                    const fs = require('fs');
                    const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    const workspaces = root.workspaces || [];
                    const versions = {};
                    for (const ws of workspaces) {
                      const pkg = JSON.parse(fs.readFileSync(ws + '/package.json', 'utf8'));
                      versions[pkg.name] = { version: pkg.version, path: ws };
                    }
                    fs.writeFileSync('/tmp/pre-versions.json', JSON.stringify(versions));
                    console.log('Pre-bump versions:', JSON.stringify(versions, null, 2));
                  "

            - name: Version packages
              if: steps.check_changesets.outputs.has_changesets == 'true'
              run: npx changeset version

            - name: Plan the releases
              if: steps.check_changesets.outputs.has_changesets == 'true'
              id: changes
              run: |
                  node <<'JS'
                  const fs = require('fs');

                  // ---- pure helpers (tests/monorepo-changeset-release.test.mjs runs these)

                  // The packages whose version `changeset version` changed. Each one
                  // is released on its own: tag `<name without scope>/v<version>`
                  // (callers trigger builds on these tags, so keep the format) and
                  // a GitHub Release titled `<name> v<version>`, as ops-hub titles
                  // its Releases. A package with no version before the bump is
                  // skipped.
                  function changedPackages(pre, current) {
                    const changed = [];
                    for (const pkg of current) {
                      const oldVersion = pre[pkg.name] && pre[pkg.name].version;
                      if (!oldVersion || oldVersion === pkg.version) continue;
                      changed.push({
                        name: pkg.name,
                        path: pkg.path,
                        oldVersion: oldVersion,
                        newVersion: pkg.version,
                        tag: pkg.name.replace(/^@[^/]+\//, '') + '/v' + pkg.version,
                        title: pkg.name + ' v' + pkg.version,
                      });
                    }
                    return changed;
                  }

                  // Names every released package, for the release commit and the sync PR.
                  function releaseLabel(changed) {
                    return changed.map((c) => c.name + '@v' + c.newVersion).join(', ');
                  }

                  // The body of a CHANGELOG.md's `## <version>` section, without the
                  // heading; null when there is no such section. Compared as text, so
                  // `1.5.2` matches neither `1.5.20` nor `1x5x2`. CRLF files read too.
                  function changelogEntry(changelog, version) {
                    const lines = changelog.split(/\r?\n/);
                    const heading = '## ' + version;
                    const at = lines.findIndex((l) => l === heading || l.startsWith(heading + ' '));
                    if (at < 0) return null;
                    let stop = lines.findIndex((l, i) => i > at && l.startsWith('## '));
                    if (stop < 0) stop = lines.length;
                    return lines.slice(at + 1, stop).join('\n').trim();
                  }

                  // ---- main
                  const pre = JSON.parse(fs.readFileSync('/tmp/pre-versions.json', 'utf8'));
                  const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                  const current = (root.workspaces || []).map((ws) => {
                    const pkg = JSON.parse(fs.readFileSync(ws + '/package.json', 'utf8'));
                    return { path: ws, name: pkg.name, version: pkg.version };
                  });
                  const changed = changedPackages(pre, current);
                  const out = process.env.GITHUB_OUTPUT;
                  if (changed.length === 0) {
                    console.log('No version changes detected.');
                    fs.appendFileSync(out, 'has_changes=false\n');
                    process.exit(0);
                  }

                  fs.mkdirSync('/tmp/release-notes', { recursive: true });
                  changed.forEach((c, i) => {
                    const clPath = c.path + '/CHANGELOG.md';
                    const entry = fs.existsSync(clPath) ? changelogEntry(fs.readFileSync(clPath, 'utf8'), c.newVersion) : null;
                    c.notesFile = '/tmp/release-notes/' + i + '.md';
                    if (!entry) console.log('::warning title=No changelog entry::' + clPath + ' has no "## ' + c.newVersion + '" section; the Release says only "Release ' + c.title + '."');
                    fs.writeFileSync(c.notesFile, (entry || 'Release ' + c.title + '.') + '\n');
                    console.log('---- ' + c.title + ' (' + c.oldVersion + ' -> ' + c.newVersion + ', tag ' + c.tag + ')');
                    console.log(fs.readFileSync(c.notesFile, 'utf8'));
                  });
                  fs.writeFileSync('/tmp/changed.json', JSON.stringify(changed));
                  fs.appendFileSync(out, 'has_changes=true\n');
                  fs.appendFileSync(out, 'label=' + releaseLabel(changed) + '\n');
                  JS

            - name: Commit version bump
              if: steps.changes.outputs.has_changes == 'true'
              env:
                  LABEL: ${{ steps.changes.outputs.label }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "chore(release): ${LABEL}"

            - name: Create per-package tags
              if: steps.changes.outputs.has_changes == 'true'
              run: |
                  # One annotated tag per released package. There is no repo-wide
                  # `v<version>` tag: it named the release after whichever package
                  # came first in `workspaces`. A tag that already exists fails this
                  # step, before anything is pushed. jq runs on its own line so that
                  # its failure fails the step instead of tagging nothing.
                  tags=$(jq -r '.[].tag' /tmp/changed.json)
                  [ -n "$tags" ] || { echo "::error::/tmp/changed.json lists no tags"; exit 1; }
                  for tag in $tags; do
                    echo "Creating tag: $tag"
                    git tag -a "$tag" -m "$tag"
                  done

            - name: Push commit and tags
              id: push
              if: steps.changes.outputs.has_changes == 'true'
              env:
                  BRANCH: ${{ github.ref_name }}
              # --atomic: if the branch push is refused (main moved since checkout),
              # no tag lands either. Without it the tags still pushed, onto a
              # commit that isn't on the branch, and fired the callers' tag builds.
              run: git push --atomic origin "$BRANCH" --follow-tags

            - name: Create GitHub Releases
              if: steps.changes.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # One Release per package, on its tag. A failure doesn't stop the
                  # others; the step fails at the end and names each missing one.
                  # The tags are pushed by now, so create a missing Release by hand.
                  rows=$(jq -r '.[] | [.tag, .title, .notesFile] | @tsv' /tmp/changed.json)
                  [ -n "$rows" ] || { echo "::error::/tmp/changed.json lists no packages"; exit 1; }
                  failed=""
                  while IFS=$'\t' read -r tag title notes; do
                    if ! gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes" </dev/null; then
                      echo "::error title=GitHub Release not created::${tag}: create it with gh release create ${tag} --verify-tag --title '${title}', with the package's CHANGELOG section for that version as notes"
                      failed="${failed} ${tag}"
                    fi
                  done <<< "$rows"
                  if [ -n "$failed" ]; then
                    echo "GitHub Releases not created:${failed}"
                    exit 1
                  fi

            # Runs even when a Release failed: the pushed commit consumed the
            # changesets, and develop must get it or it would release them again.
            - name: Create PR to sync back
              if: ${{ !cancelled() && steps.push.outcome == 'success' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  LABEL: ${{ steps.changes.outputs.label }}
                  SYNC_BRANCH: ${{ inputs.sync-branch }}
                  BRANCH: ${{ github.ref_name }}
              run: |
                  gh pr create \
                    --base "$SYNC_BRANCH" \
                    --head "$BRANCH" \
                    --title "chore: sync release ${LABEL} back to ${SYNC_BRANCH}" \
                    --body "Automated PR to sync version bump and changelog back to ${SYNC_BRANCH}." \
                    || echo "::warning title=Sync PR not created::No PR from ${BRANCH} to ${SYNC_BRANCH} was opened (one may already exist). If none is open, open it by hand, or ${SYNC_BRANCH} will release these changesets again."
