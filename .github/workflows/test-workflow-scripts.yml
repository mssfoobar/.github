name: Test workflow scripts

# Runs the tests for logic that lives inline in a reusable workflow or a
# composite action, such as npm-snapshot-publish's content gate
# (tests/npm-snapshot-publish-gate.test.mjs), the Claude Code cache
# (tests/claude-code-cache.test.mjs) and android-gradle-build's secret export
# (tests/android-gradle-build-secrets.test.mjs).

on:
  pull_request:
    paths:
      - '.github/workflows/npm-snapshot-publish.yml'
      - '.github/workflows/android-gradle-build.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/actions/**'
      - '.github/workflows/test-workflow-scripts.yml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
