# Keeps the SHA pins in the reusable workflows fresh.
#
# These workflows are consumed by every repo in the org, so a stale pin here
# propagates everywhere — worse than a stale pin in a single repo. Pinning
# without a bump mechanism just trades a supply-chain risk for a rot risk.
#
# Mirrors ops-hub's cooldown policy: wait out a minimum release age before
# adopting a version update, so a compromised release has time to be detected
# and yanked. Security updates are exempt and still open immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; composite actions are scanned only from their own directory.
    directories:
      - /
      - /.github/actions/*
    # Monday 08:30 Singapore time, with ops-hub's other dependency PRs.
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One PR a week for every action, majors included (one PR per major used
    # to wait here unmerged for weeks), and one for security fixes once those
    # are switched on.
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
